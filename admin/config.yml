# Admin panel settings (Decap CMS)
backend:
  name: github
  repo: neyseo/volgayildiz-site
  branch: main
  base_url: https://volgayildiz-panel-login.volgayildiz.workers.dev
  commit_messages:
    create: "Create {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

locale: en
site_url: https://www.volgayildiz.com
display_url: https://www.volgayildiz.com
logo_url: /images/site/logo-yuvarlakx.png

media_folder: images/uploads
public_folder: /images/uploads

collections:
  # ------------------------------------------------------------ galleries
  - name: galleries
    label: Galleries
    editor: { preview: false }
    files:
      - &gallery
        name: interior
        label: Interior
        file: content/galleries/interior.json
        fields: &galleryFields
          - { name: title, label: Title, widget: string }
          - name: photos
            label: Photos
            widget: thumbs
            fields:
              - { name: image, label: Photo, widget: image }
              - name: caption
                label: Caption (shown bottom-left)
                widget: text
                required: false
                hint: "Press Enter for a new line. Leave empty for no caption."
      - { <<: *gallery, name: editorial, label: Editorial, file: content/galleries/editorial.json }
      - { <<: *gallery, name: inprint, label: In Print, file: content/galleries/inprint.json }
      - { <<: *gallery, name: home, label: Home, file: content/galleries/home.json }

  # ------------------------------------------------------------ pages
  - name: pages
    label: Pages
    editor: { preview: false }
    files:
      - &page
        name: about
        label: About
        file: content/pages/about.json
        fields: &pageFields
          - { name: title, label: Title, widget: string }
          - { name: text, label: Text, widget: text, required: false, hint: "Press Enter for a new line." }
          - name: images
            label: Photos
            widget: thumbs
            required: false
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: caption, label: Caption, widget: text, required: false }
          - { name: video, label: Video, widget: file, required: false, hint: "MP4 file, under 50 MB." }
          - { name: video_poster, label: Video cover image, widget: image, required: false }
      - { <<: *page, name: book-lab, label: "Exhibits › Book Lab", file: content/pages/book-lab.json }
      - { <<: *page, name: auction, label: "Exhibits › Auction", file: content/pages/auction.json }
      - { <<: *page, name: fresh-brains, label: "Exhibits › Fresh Brains", file: content/pages/fresh-brains.json }
      - { <<: *page, name: quick-art, label: "Exhibits › Quick Art", file: content/pages/quick-art.json }

  # ------------------------------------------------------------ cover + settings
  - name: site
    label: Cover & Settings
    editor: { preview: false }
    files:
      - name: cover
        label: Cover page
        file: content/cover.json
        fields:
          - { name: button, label: Button text, widget: string, default: "come in" }
          - name: slides
            label: Cover photos
            widget: thumbs
            captions: false
            fields:
              - { name: image, label: Photo, widget: image }
      - name: settings
        label: Site settings
        file: content/settings.json
        fields:
          - { name: title, label: Site name, widget: string }
          - { name: logo, label: Logo, widget: image, required: false }
          - { name: email, label: Email (Contact), widget: string }
          - { name: behance, label: Behance URL, widget: string, required: false }
          - { name: instagram, label: Instagram URL, widget: string, required: false }
