<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Yönetim Paneli — VOLGA YILDIZ</title>
  <link rel="icon" href="/images/site/logo-yuvarlakx.png">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* Notification after publishing: deep red */
    .Toastify__toast--success, .Toastify__toast--success * {
      background: #7a0c0c !important; color: #fff !important; border-color: #7a0c0c !important;
    }
    .Toastify__toast--success svg { fill: #fff !important; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="/admin/thumbs-widget.js"></script>
  <script>
    // Shorter top-bar wording in the editor
    (function () {
      var base = CMS.getLocale && CMS.getLocale('tr');
      if (!base) return;
      var p = JSON.parse(JSON.stringify(base));
      var t = p.editor && p.editor.editorToolbar;
      if (!t) return;
      t.backCollection = 'Menu';
      t.unsavedChanges = 'Save';
      t.changesSaved = 'Saved';
      t.publish = 'Publish';
      t.published = 'Published';
      t.publishing = 'Publishing...';
      t.publishNow = 'Publish now';
      t.deployButtonLabel = 'View Live';
      var toast = p.ui && p.ui.toast;
      if (toast) { toast.entrySaved = 'Saved'; toast.entryPublished = 'Saved'; }
      CMS.registerLocale('tr', p);
    })();
  </script>
  <script>
    // Captions keep their line breaks in the panel preview, as on the site.
    CMS.registerPreviewStyle('figcaption, .caption { white-space: pre-line; }', { raw: true });
  </script>
</body>
</html>
